name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest
      - run: python -m digest.cli validate-profile profile.yaml
  schema-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: gowthamsai09/Axon
          path: hub
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Exported schemas must equal the hub copy
        run: python -m scripts.export_schemas --check hub/schemas
      - name: Shared corpora and prompts (hub) against the real guards, sanitizer and validator
        env:
          HUB_CORPUS_DIR: ${{ github.workspace }}/hub/corpus/injection
          HUB_DIR: ${{ github.workspace }}/hub
          REQUIRE_HUB_CORPUS: "1"
          REQUIRE_HUB_PROMPTS: "1"
        run: python -m scripts.check_prompt_sync --hub hub && pytest tests/test_injection_corpus.py tests/test_ssrf.py tests/test_prompt_hub.py
