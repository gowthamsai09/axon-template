name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@<pin-to-commit-sha>  # TODO: resolve per docs/pinning-actions.md in the hub repo
        with:
          persist-credentials: false
      - uses: actions/setup-python@<pin-to-commit-sha>  # TODO: resolve per docs/pinning-actions.md in the hub repo
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest
      - run: python -m digest.cli validate-profile profile.yaml
  schema-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@<pin-to-commit-sha>  # TODO: resolve per docs/pinning-actions.md in the hub repo
        with:
          persist-credentials: false
      - uses: actions/checkout@<pin-to-commit-sha>  # TODO: resolve per docs/pinning-actions.md in the hub repo
        with:
          repository: gowthamsai09/Axon
          path: hub
          persist-credentials: false
      - uses: actions/setup-python@<pin-to-commit-sha>  # TODO: resolve per docs/pinning-actions.md in the hub repo
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Exported schemas must equal the hub copy
        run: python -m scripts.export_schemas --check hub/schemas
