# Mints a caller token for the gateway (spec 9.2 step 5, Appendix C 64). The token is written ONCE to
# this run's job summary. Copy it, then DELETE the run (Actions > this run > ... > Delete workflow run).
name: issue-token
on:
  workflow_dispatch:
    inputs:
      label:
        description: "Label for the token (letters, digits, space, . _ -; at most 64), e.g. my-research-agent"
        required: true
      expires_in_days:
        description: "Lifetime in days (1 to 365)"
        required: false
        default: "90"
permissions:
  id-token: write
  contents: read
jobs:
  issue:
    if: "github.repository != 'gowthamsai09/axon-template'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a token
        env:
          GATEWAY: ${{ vars.GATEWAY_URL }}
          LABEL: ${{ inputs.label }}
          EXPIRES_IN_DAYS: ${{ inputs.expires_in_days }}
        run: |
          set -euo pipefail
          GATEWAY="${GATEWAY%/}"
          case "$GATEWAY" in
            https://*) ;;
            *) echo "Set the repository variable GATEWAY_URL to the gateway's https URL." >&2; exit 1 ;;
          esac
          if ! [[ "$LABEL" =~ ^[A-Za-z0-9\ ._-]{1,64}$ ]]; then
            echo "label must be 1 to 64 characters: letters, digits, space, dot, underscore, hyphen." >&2; exit 1
          fi
          if ! [[ "$EXPIRES_IN_DAYS" =~ ^[0-9]{1,3}$ ]] || [ "$((10#$EXPIRES_IN_DAYS))" -lt 1 ] || [ "$((10#$EXPIRES_IN_DAYS))" -gt 365 ]; then
            echo "expires_in_days must be a whole number from 1 to 365." >&2; exit 1
          fi
          AUD="$(jq -rn --arg a "$GATEWAY" '$a|@uri')"
          OIDC="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" | jq -r .value)"
          echo "::add-mask::$OIDC"
          BODY="$(jq -nc --arg label "$LABEL" --argjson days "$((10#$EXPIRES_IN_DAYS))" '{label: $label, expires_in_days: $days}')"
          CODE="$(curl -sS -o "$RUNNER_TEMP/token.json" -w '%{http_code}' -X POST "$GATEWAY/tokens" \
            -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" -d "$BODY")"
          if [ "$CODE" != "201" ]; then
            echo "Token request failed (HTTP $CODE). Run the register workflow first if you have not." >&2
            rm -f "$RUNNER_TEMP/token.json"
            exit 1
          fi
          TOKEN="$(jq -r .token "$RUNNER_TEMP/token.json")"
          TOKEN_ID="$(jq -r .id "$RUNNER_TEMP/token.json")"
          EXPIRES="$(jq -r .expires_at "$RUNNER_TEMP/token.json")"
          rm -f "$RUNNER_TEMP/token.json"
          echo "::add-mask::$TOKEN"
          {
            printf '%s\n' "## Axon token (shown once)" ""
            printf '%s\n' "Copy it now, then delete this workflow run. Only a hash is stored by the gateway." ""
            printf '%s\n' '```' "$TOKEN" '```' ""
            printf 'Token id: %s (use it with the revoke-token workflow)\n\n' "$TOKEN_ID"
            printf 'Expires: %s\n' "$EXPIRES"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Token ${TOKEN_ID} issued. It is in this run's job summary, once. Delete the run after copying it."
