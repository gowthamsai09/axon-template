# Onboarding (spec 6.8, Appendix C 101). The owner fills in the Issue form; this workflow checks
# it with the real profile model, commits profile.yaml and replies with the cron line to paste.
# The Issue body is untrusted text: it reaches code through env: only and is never echoed.
# Personal-account repositories only: the author must be the repository owner.
name: onboard
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write   # commits profile.yaml to the default branch (never workflow files)
  issues: write     # replies on, and closes, the onboarding Issue
concurrency:
  group: onboard
  cancel-in-progress: false
jobs:
  onboard:
    if: >-
      github.repository != 'gowthamsai09/axon-template' &&
      github.event.issue.state == 'open' &&
      github.event.issue.user.type == 'User' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.sender.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'onboarding')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Check the form and write profile.yaml
        id: check
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}   # untrusted: env only
        run: |
          set -uo pipefail
          if python -m digest.cli onboard --comment-file "$RUNNER_TEMP/comment.md"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
          if [ ! -s "$RUNNER_TEMP/comment.md" ]; then
            echo "Axon onboarding: the form could not be processed. Nothing was changed." \
              > "$RUNNER_TEMP/comment.md"
          fi
      - name: Commit profile.yaml
        if: steps.check.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "onboard-bot"
          git config user.email "onboard-bot@users.noreply.github.com"
          git add profile.yaml
          if git diff --cached --quiet; then
            echo "profile.yaml is unchanged"
            exit 0
          fi
          git commit -q -m "Onboarding: update profile.yaml"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=Authorization: basic $AUTH" push -q origin "HEAD:refs/heads/$BRANCH"
      - name: Reply on the Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          VALID: ${{ steps.check.outputs.valid }}
        run: |
          set -euo pipefail
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) echo "bad issue number" >&2; exit 1 ;; esac
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          if [ "$VALID" = "true" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi
